name: web

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - .github/workflows/web.yml
  pull_request:
    paths:
      - apps/web/**
      - .github/workflows/web.yml

defaults:
  run:
    working-directory: apps/web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:i18n
      - run: pnpm build
      - run: pnpm check:meta
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:lighthouse
      # Links to pages listed in tests/pending.ts are skipped until those pages are built.
      - name: List pending routes
        id: pending
        run: node --input-type=module -e 'const { pending } = await import("./tests/pending.ts"); console.log("exclude=" + pending.routes.map((r) => "--exclude " + r + "?$").join(" "))' >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: apps/web/.lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - uses: lycheeverse/lychee-action@v2
        with:
          workingDirectory: apps/web
          args: >-
            --root-dir ${{ github.workspace }}/apps/web/dist --no-progress --cache --max-cache-age 1d
            ${{ steps.pending.outputs.exclude }} 'dist/**/*.html'
