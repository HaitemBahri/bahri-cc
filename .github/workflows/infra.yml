name: infra

on:
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/release-*.yml
      - .github/workflows/infra.yml
  pull_request:
    paths:
      - infra/**
      - .github/workflows/release-*.yml
      - .github/workflows/infra.yml

defaults:
  run:
    working-directory: infra

jobs:
  synth:
    runs-on: ubuntu-latest
    # Dummy IDs: synth needs no AWS access; real values come from 1Password at deploy time.
    env:
      AWS_ACCOUNT_ID: "000000000000"
      HOSTED_ZONE_ID: Z000DUMMY
      ALERT_EMAIL: alerts@example.com
      CERTIFICATE_ARN: arn:aws:acm:us-east-1:000000000000:certificate/dummy
      PREVIEW_TOKEN: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: infra/global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test edge/edge.test.mjs
      - run: dotnet restore src/Infra --locked-mode
      - run: dotnet build src --no-restore
      - run: npx -y aws-cdk@2.1144.0 synth --quiet -c distributionId=EDUMMY -c "cspScriptHashes='sha256-dummy'"
